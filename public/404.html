<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>نظام جامع سعيد الجابي - إعادة التوجيه</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: preserves path, query and hash
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 50px; direction: rtl; background: #f8faf9; color: #064e3b;">
    <h2>جاري تحويلك إلى نظام جامع سعيد الجابي...</h2>
    <p>يرجى الانتظار لحظات</p>
  </body>
</html>
